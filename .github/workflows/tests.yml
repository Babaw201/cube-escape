name: Limbyrinth tests
on:
  push:
    branches: [main, feat/pseudos-amis]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - name: Test Blender script compatibility
        run: python3 -B -m unittest discover -s tests -p 'test_vortex_script_paths.py'
      - name: Select installed Chromium
        shell: bash
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "CHROMIUM_PATH=$(command -v "$browser")" >> "$GITHUB_ENV"
              "$browser" --version
              exit 0
            fi
          done
          npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload VORTEX desktop and mobile renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-browser-renders
          path: artifacts/vortex-*.png
          if-no-files-found: ignore
  blender-52:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender 5.2
        run: |
          curl --fail --location --retry 1 --connect-timeout 15 --max-time 240 \
            https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz \
            --output /tmp/blender.tar.xz
          mkdir /tmp/blender-52
          tar -xf /tmp/blender.tar.xz --directory /tmp/blender-52 --strip-components=1
      - name: Export VORTEX in Blender 5.2 with French editor context
        run: /tmp/blender-52/blender --background --factory-startup --threads 2 --python-exit-code 1 --python tests/blender_vortex_smoke.py
